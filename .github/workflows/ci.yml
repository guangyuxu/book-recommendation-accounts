# CI: four parallel jobs.
#   checks      — runs `make ci` (lint + coverage): the SAME command you run locally, the single
#                 ground truth. Only infrastructure that make cannot own lives here (Postgres
#                 service, DB init, uv/cache setup, coverage-artifact upload); every actual check
#                 lives in the Makefile CHECKS section, so CI and local cannot drift.
#   integration — runs `make integration`: the end-to-end business journeys against a throwaway real
#                 Postgres. Kept OUT of `make ci` (slower, needs the pg binaries) but still run on
#                 every PR — its own job, so a red journey is unmistakable.
#   docker      — image build check.
#   secrets     — gitleaks secret scan (server-side backstop for the pre-commit hook).
# checks/docker run inside a Python 3.13 container for sandbox isolation; integration cannot (see
# the note on that job). Dependency auditing (pip-audit) is deliberately elsewhere (scheduled
# audit.yml) so a network / advisory hiccup never blocks a code PR.

name: CI

on:
  push:
    branches: ["master", "dev"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# Cancel earlier runs on the same branch/PR when a new push arrives.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Checks (== `make ci`) ─────────────────────────────────────────────────
  checks:
    name: Checks (make ci)
    runs-on: ubuntu-latest
    container:
      image: python:3.13-slim
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: ci
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      # unit_tests/conftest.py uses setdefault, so this wins over the sqlite temp file
      # and tests run against real Postgres. This service OWNS the `accounts` schema.
      DATABASE_URL: postgresql+psycopg://ci:ci@postgres:5432/ci?options=-csearch_path%3Daccounts
      # Place the uv cache inside the workspace so actions/cache can reach it
      # from both the runner and the container.
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@v7

      # python:3.13-slim ships without make; `make ci` needs it.
      - name: Install make
        run: apt-get update && apt-get install -y --no-install-recommends make

      - uses: actions/cache@v6
        with:
          path: .cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      # Ensure the schema exists so the per-test create_all can build the tables. init_db() is
      # idempotent (CREATE SCHEMA IF NOT EXISTS + create_all) and is the schema-bootstrap mechanism
      # in every environment; tests recreate tables per-test from the models.
      - name: Set up database
        run: uv run python -c "from accounts.db import init_db; init_db()"

      # THE ground truth: byte-for-byte the same command developers run locally.
      - name: make ci
        run: make ci

      # coverage data was produced by `make ci` (its coverage target); emit XML for the artifact.
      - name: Coverage XML
        run: uv run coverage xml

      - name: Upload coverage report
        uses: actions/upload-artifact@v7
        with:
          name: coverage-report
          path: coverage.xml

  # ── 2. Integration journeys (== `make integration`) ──────────────────────────
  # Runs on the runner directly, NOT in the python:3.13-slim container the other jobs use:
  # pytest-postgresql starts its throwaway cluster by shelling out to `initdb`, and initdb REFUSES
  # to run as root — which is exactly what a job inside a container is. The runner's default user is
  # unprivileged, so the cluster comes up there. No `services:` block either: the suite owns its own
  # cluster (a temp datadir on a random port) and points DATABASE_URL at it in conftest.
  integration:
    name: Integration (make integration)
    runs-on: ubuntu-latest
    env:
      UV_CACHE_DIR: ${{ github.workspace }}/.cache/uv
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - uses: actions/cache@v6
        with:
          path: .cache/uv
          key: uv-${{ runner.os }}-${{ hashFiles('uv.lock') }}
          restore-keys: uv-${{ runner.os }}-

      - name: Put the Postgres server binaries on PATH
        run: |
          # The runner image ships a Postgres server under /usr/lib/postgresql/<major>/bin, but only
          # the client is on PATH; pytest-postgresql needs initdb/pg_ctl. Install it if a future
          # image drops it, and always pin to the highest major present.
          dir=$(ls -d /usr/lib/postgresql/*/bin 2>/dev/null | sort -V | tail -1)
          if [ -z "$dir" ]; then
            sudo apt-get update
            sudo apt-get install -y --no-install-recommends postgresql
            dir=$(ls -d /usr/lib/postgresql/*/bin | sort -V | tail -1)
          fi
          echo "$dir" >> "$GITHUB_PATH"

      - name: Install uv
        run: pip install uv

      - name: Install dependencies
        run: uv sync

      # THE ground truth: byte-for-byte the same command developers run locally.
      - name: make integration
        run: make integration

  # ── 3. Docker build ──────────────────────────────────────────────────────────
  docker:
    name: Docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set image tag
        id: tag
        run: echo "tag=$(date +%Y%m%d-%H%M%S)" >> $GITHUB_OUTPUT

      - name: Build Docker image
        run: docker build -t book-recommendation-accounts:${{ steps.tag.outputs.tag }} .

  # ── 4. Secret scan ───────────────────────────────────────────────────────────
  # Server-side backstop for the gitleaks pre-commit hook: catches secrets even if a contributor
  # never ran `pre-commit install`. fetch-depth: 0 so it scans full history on push.
  # NOTE: gitleaks-action is free for public repos; a private org needs GITLEAKS_LICENSE in env.
  # The scan step is skipped for Dependabot PRs: their GITHUB_TOKEN is read-only and has no access
  # to repo secrets, so gitleaks-action errors out, and a version-only bump cannot introduce a
  # secret anyway. The job itself still runs (reports green, satisfying a required check); the
  # full-history scan on push to master remains the real backstop.
  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: gitleaks
        if: github.actor != 'dependabot[bot]'
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
